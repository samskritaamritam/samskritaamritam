<!doctype html>
<html lang="sa">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{{ page.title }} | {{ site.title }}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    </head>
    <body>
        <header class="site-header">
            {% include site-nav.html %}
            {% include class-header.html %}
        </header>

        <main class="page">
            {{ content }}
        </main>

        <script>
         document.addEventListener("DOMContentLoaded", function () {
             const dropdowns = document.querySelectorAll(".nav-dropdown");

             dropdowns.forEach(function (dropdown) {
                 const button = dropdown.querySelector(".nav-dropdown-button");
                 const menu = dropdown.querySelector(".nav-dropdown-menu");

                 button.addEventListener("click", function (event) {
                     event.stopPropagation();

                     const isOpen = menu.classList.toggle("open");
                     button.setAttribute("aria-expanded", isOpen);
                 });
             });

             document.addEventListener("click", function () {
                 document.querySelectorAll(".nav-dropdown-menu.open").forEach(function (menu) {
                     menu.classList.remove("open");

                     const button = menu.parentElement.querySelector(".nav-dropdown-button");
                     button.setAttribute("aria-expanded", "false");
                 });
             });
         });
        </script>
        <script>
        document.addEventListener("DOMContentLoaded", function () {
            const carousel = document.querySelector(".home-carousel");

            if (!carousel) return;
        
            const slides = carousel.querySelectorAll(".home-slide");
            const dots = document.querySelectorAll(".carousel-dot");
            const previous = carousel.querySelector(".carousel-prev");
            const next = carousel.querySelector(".carousel-next");

            let current = 0;
            let timer;
        
            function showSlide(index) {
                slides[current].classList.remove("active");
                dots[current].classList.remove("active");

                current = (index + slides.length) % slides.length;

                slides[current].classList.add("active");
                dots[current].classList.add("active");
            }

            function startCarousel() {
                timer = setInterval(function () {
                    showSlide(current + 1);
                }, 7000);
            }

            function restartCarousel() {
                clearInterval(timer);
                startCarousel();
            }

            next.addEventListener("click", function () {
                showSlide(current + 1);
                restartCarousel();
            });

            previous.addEventListener("click", function () {
                showSlide(current - 1);
                restartCarousel();
            });

            dots.forEach(function (dot, index) {
                dot.addEventListener("click", function () {
                    showSlide(index);
                    restartCarousel();
                });
            });

            startCarousel();
        });
        </script>

    </body>
</html>
