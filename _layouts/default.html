<!doctype html>
<html lang="sa">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{{ page.title }} | {{ site.title }}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    </head>
    <body>
        <header class="site-header">
            {% include site-nav.html %}
            {% include class-header.html %}
        </header>

        <main class="page">
            {{ content }}
        </main>

        <script>
         document.addEventListener("DOMContentLoaded", function () {
             const dropdowns = document.querySelectorAll(".nav-dropdown");

             dropdowns.forEach(function (dropdown) {
                 const button = dropdown.querySelector(".nav-dropdown-button");
                 const menu = dropdown.querySelector(".nav-dropdown-menu");

                 button.addEventListener("click", function (event) {
                     event.stopPropagation();

                     const isOpen = menu.classList.toggle("open");
                     button.setAttribute("aria-expanded", isOpen);
                 });
             });

             document.addEventListener("click", function () {
                 document.querySelectorAll(".nav-dropdown-menu.open").forEach(function (menu) {
                     menu.classList.remove("open");

                     const button = menu.parentElement.querySelector(".nav-dropdown-button");
                     button.setAttribute("aria-expanded", "false");
                 });
             });
         });
        </script>
    </body>
</html>
